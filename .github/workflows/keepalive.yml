# Supabase 免费版「7天无活动自动暂停」保活（双保险版 2026-09-21）
# 信号1：Session pooler 数据库直连（psql，独立于 REST 的官方活动信号，IPv4 可跑）
# 信号2：REST 心跳写入（保留原有通道）
# 附带：仓库自 commit，防止 GitHub 60 天无活动禁用定时任务
# 失败判定：psql 退出码非 0 或 REST INSERT 非 201 → run 变红，杜绝假绿
name: Keep Supabase Awake
on:
  schedule:
    - cron: "0 8 * * *"   # 每天 UTC 08:00（北京时间 16:00 左右，GitHub 常延迟 1-5 小时）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 数据库直连保活（Session pooler）
        env:
          PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD="$PASS" psql -w -h aws-1-ap-northeast-2.pooler.supabase.com \
            -p 5432 -U "postgres.vwsgzgffyhojluzccuif" -d postgres \
            -c "SELECT 1 AS alive;"
          CODE=$?
          echo "psql direct -> exit $CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::数据库直连失败（密码错误/网络问题/项目已暂停）"
            exit 1
          fi
      - name: Ping Supabase (REST 心跳,真实写操作)
        env:
          KEY: sb_publishable_tSqvz01p0fj9td5QBjyRIQ_chV02GUg
          URL: https://vwsgzgffyhojluzccuif.supabase.co
        run: |
          INS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/keepalive_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" -d '{}')
          echo "insert heartbeat -> HTTP $INS"
          if [ "$INS" != "201" ]; then
            echo "::error::保活写入失败 HTTP $INS（心跳表不存在 / key 失效 / 项目已暂停）"
            exit 1
          fi
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$URL/rest/v1/keepalive_ping?id=neq.00000000-0000-0000-0000-000000000000" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "delete heartbeat -> HTTP $DEL"
          curl -s -o /dev/null -w "select fallback -> HTTP %{http_code}\n" \
            "$URL/rest/v1/results?select=id&limit=1&apikey=$KEY"
      - name: 维持仓库活跃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 写入时间戳
        run: |
          date -u > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u)" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin ${GITHUB_REF_NAME} || true
